name: Master merged

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:
    branches: [ 'master' ]

concurrency:
  group: 'master'
  cancel-in-progress: true

permissions:
  contents: 'write'
  id-token: 'write'

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      bumped-sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python
        if: success() # Last step was performed successfully
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install deps
        if: success() # Last step was performed successfully
        run: |
          pip install -r dev-requirements.txt
          pip install -r requirements.txt

      - name: Build
        if: success()
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel twine build
          python -m build

      - name: Bump Version
        if: success()
        run: |
          pip install --upgrade bumpversion
          bumpversion --no-tag --no-commit minor

      - name: Push changes
        id: push
        if: success()
        run: |
          git config --global user.email "url-signer-pythons@ioriver.io"
          git config --global user.name "url-signer-pythons"
          git config --global credential.helper store
          git config --global credential.helper 'cache --timeout=3600'
          git add .bumpversion.cfg requirements.txt pyproject.toml setup.py
          git commit -m "New version release - Bump version"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.bumped-sha }}

      - name: Build
        if: success()
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish
        if: success()
        uses: pypa/gh-action-pypi-publish@release/v1